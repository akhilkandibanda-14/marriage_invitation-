<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wedding & Reception Card Designer</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;900&family=Great+Vibes&family=Playfair+Display:ital,wght@0,600;0,800;1,600&family=Alex+Brush&family=Noto+Serif+Telugu:wght@500;700&family=Noto+Serif+Devanagari:wght@500;700&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    :root {
      --maroon: #6B1724;
      --maroon-dark: #450B13;
      --emerald: #143D27;
      --emerald-dark: #0A2416;
      --gold: #D4AF37;
      --gold-light: #FFE58F;
      --cream: #FAF6F0;
    }
    
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    
    body {
      font-family: 'Montserrat', sans-serif;
      background: #181214;
      color: #F5EFEB;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    
    /* Top Navigation */
    .top-bar {
      background: #251317;
      padding: 14px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 2px solid var(--gold);
    }
    
    .top-bar a {
      color: var(--gold-light);
      text-decoration: none;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 0.95rem;
    }
    
    .top-bar h1 {
      font-family: 'Playfair Display', serif;
      font-size: 1.3rem;
      color: #fff;
    }

    /* Mode Switcher Tabs */
    .card-mode-tabs {
      display: flex;
      justify-content: center;
      gap: 16px;
      background: #1D1517;
      padding: 16px 20px;
      border-bottom: 1px solid rgba(212, 175, 55, 0.25);
    }

    .tab-btn {
      padding: 12px 24px;
      border-radius: 50px;
      border: 1.5px solid var(--gold);
      background: transparent;
      color: var(--gold-light);
      font-family: 'Playfair Display', serif;
      font-size: 1.05rem;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 10px;
      transition: all 0.3s ease;
    }

    .tab-btn.active {
      background: linear-gradient(135deg, #FFE58F 0%, #D4AF37 50%, #AA771C 100%);
      color: #2E0B12;
      box-shadow: 0 4px 18px rgba(212, 175, 55, 0.4);
      border-color: #FFE58F;
    }

    /* Layout Split */
    .app-container {
      display: flex;
      flex: 1;
      max-width: 1300px;
      width: 100%;
      margin: 0 auto;
      padding: 24px 20px;
      gap: 30px;
    }
    
    @media (max-width: 900px) {
      .app-container {
        flex-direction: column;
      }
      .card-mode-tabs {
        flex-direction: column;
      }
      .tab-btn {
        justify-content: center;
      }
    }
    
    /* Left Controls Panel */
    .controls-panel {
      flex: 1;
      background: #251B1E;
      border-radius: 16px;
      padding: 25px;
      border: 1px solid rgba(212, 175, 55, 0.3);
      box-shadow: 0 10px 30px rgba(0,0,0,0.4);
      height: fit-content;
    }
    
    .panel-title {
      font-family: 'Playfair Display', serif;
      color: var(--gold-light);
      font-size: 1.4rem;
      margin-bottom: 15px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .preset-buttons {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }

    .preset-btn {
      flex: 1;
      padding: 8px 12px;
      border-radius: 8px;
      border: 1px solid var(--gold);
      background: rgba(212, 175, 55, 0.1);
      color: var(--gold-light);
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .preset-btn.active, .preset-btn:hover {
      background: var(--gold);
      color: #380C13;
    }
    
    .form-group {
      margin-bottom: 14px;
    }
    
    .form-group label {
      display: block;
      font-size: 0.82rem;
      color: #E2D2BC;
      margin-bottom: 5px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      font-weight: 600;
    }
    
    .form-group input, .form-group textarea, .form-group select {
      width: 100%;
      padding: 10px 14px;
      border-radius: 8px;
      background: #191012;
      border: 1px solid #4D3338;
      color: #fff;
      font-size: 0.95rem;
      outline: none;
      font-family: inherit;
      transition: border-color 0.2s;
    }
    
    .form-group input:focus, .form-group textarea:focus {
      border-color: var(--gold);
    }
    
    .form-row {
      display: flex;
      gap: 12px;
    }
    
    .form-row .form-group {
      flex: 1;
    }

    /* Right Preview Panel */
    .preview-panel {
      flex: 1.1;
      display: flex;
      flex-direction: column;
      align-items: center;
      background: #251B1E;
      border-radius: 16px;
      padding: 25px;
      border: 1px solid rgba(212, 175, 55, 0.3);
      box-shadow: 0 10px 30px rgba(0,0,0,0.4);
    }
    
    .preview-title {
      font-family: 'Playfair Display', serif;
      color: var(--gold-light);
      font-size: 1.2rem;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .canvas-container {
      max-width: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      margin-bottom: 20px;
      box-shadow: 0 15px 40px rgba(0,0,0,0.6);
      border-radius: 12px;
      overflow: hidden;
      border: 2px solid var(--gold);
    }

    canvas {
      max-width: 100%;
      height: auto;
      max-height: 600px;
      display: block;
      background: #fff;
    }

    /* Action Buttons */
    .action-buttons {
      display: flex;
      gap: 14px;
      width: 100%;
      max-width: 440px;
    }

    .btn-download {
      flex: 1;
      padding: 14px 20px;
      background: linear-gradient(135deg, #FFE58F 0%, #D4AF37 50%, #AA771C 100%);
      color: #380C13;
      font-weight: 700;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      font-size: 1rem;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 0 4px 15px rgba(212, 175, 55, 0.4);
      transition: all 0.2s ease;
    }

    .btn-download:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(212, 175, 55, 0.6);
    }
  </style>
</head>
<body>

  <header class="top-bar">
    <a href="index.html"><i class="fas fa-arrow-left"></i> Back to Main Website</a>
    <h1>Wedding & Reception Card Designer</h1>
    <a href="index.html#rsvp"><i class="fab fa-whatsapp"></i> WhatsApp RSVP</a>
  </header>

  <!-- Card Mode Selection Tabs -->
  <nav class="card-mode-tabs">
    <button class="tab-btn" id="tabMarriage" onclick="switchCardMode('marriage')">
      <i class="fas fa-fire-flame-curved"></i> 1. Marriage Card (Dec 4 - Temple Theme)
    </button>
    <button class="tab-btn active" id="tabReception" onclick="switchCardMode('reception')">
      <i class="fas fa-champagne-glasses"></i> 2. Reception Card (Dec 5 - Emerald Luxury)
    </button>
  </nav>

  <main class="app-container">
    <!-- Left Controls Panel -->
    <section class="controls-panel">
      <h2 class="panel-title" id="panelHeading"><i class="fas fa-pen-fancy"></i> Reception Card Details</h2>

      <div class="preset-buttons" id="presetsContainer">
        <button class="preset-btn active" id="btnPresetEn" onclick="loadPreset('en')">English</button>
        <button class="preset-btn" id="btnPresetTe" onclick="loadPreset('te')">Telugu (తెలుగు)</button>
        <button class="preset-btn" id="btnPresetHi" onclick="loadPreset('hi')">Hindi (हिंदी)</button>
      </div>

      <!-- Input Fields -->
      <div id="dynamicFormFields">
        <!-- Rendered dynamically by script -->
      </div>

      <div class="form-row">
        <div class="form-group">
          <label>Vertical Position</label>
          <input type="range" id="inputYOffset" min="-80" max="80" value="0" oninput="renderCard()">
        </div>
        <div class="form-group">
          <label>Font Size Scale</label>
          <input type="range" id="inputFontScale" min="0.8" max="1.3" step="0.05" value="1.0" oninput="renderCard()">
        </div>
      </div>
    </section>

    <!-- Right Live Preview & Download Panel -->
    <section class="preview-panel">
      <h2 class="preview-title" id="previewHeading"><i class="fas fa-eye"></i> Live Reception Card Preview</h2>
      
      <div class="canvas-container">
        <canvas id="cardCanvas"></canvas>
      </div>

      <div class="action-buttons">
        <button class="btn-download" id="downloadBtn" onclick="downloadCard()">
          <i class="fas fa-download"></i> Download Reception Card (WhatsApp)
        </button>
      </div>
      <p style="font-size:0.8rem; color:#A69595; margin-top:12px; text-align:center;">
        💡 High resolution export ready to share directly on WhatsApp chats, groups, and status!
      </p>
    </section>
  </main>

  <script src="config.js"></script>
  <script>
    const canvas = document.getElementById('cardCanvas');
    const ctx = canvas.getContext('2d');

    let currentMode = 'reception'; // 'marriage' or 'reception'
    let currentLang = 'en';

    // Image assets
    const imgMarriage = new Image();
    imgMarriage.src = 'images/marriage_card.jpg';

    const imgReception = new Image();
    imgReception.src = 'images/reception_card_clean.jpg';

    // State object initialized from WEDDING_CONFIG
    const state = {
      marriage: {
        shloka: "|| శ్రీరస్తు - శుభమస్తు ||",
        groom: (typeof WEDDING_CONFIG !== 'undefined' && WEDDING_CONFIG.couple?.groom?.fullName) || "Venkatesh Reddy",
        bride: (typeof WEDDING_CONFIG !== 'undefined' && WEDDING_CONFIG.couple?.bride?.fullName) || "Ananya Reddy",
        parents: "S/o Smt. & Sri Parents' Name",
        date: (typeof WEDDING_CONFIG !== 'undefined' && `${WEDDING_CONFIG.events?.wedding?.dateFormatted} | ${WEDDING_CONFIG.events?.wedding?.timeFormatted}`) || "Dec 4, 2026 | Muhurtham: 9:30 AM",
        receptionSummary: (typeof WEDDING_CONFIG !== 'undefined' && `Reception: ${WEDDING_CONFIG.events?.reception?.dateFormatted} | ${WEDDING_CONFIG.events?.reception?.timeFormatted}`) || "Reception: Dec 5, 2026 | 7:00 PM",
        venue: (typeof WEDDING_CONFIG !== 'undefined' && WEDDING_CONFIG.events?.wedding?.venueName) || "Sri Raja Rajeshwari Kalyana Mandapam, Hyderabad",
        family: "With Best Compliments from Family & Friends"
      },
      reception: {
        groom: (typeof WEDDING_CONFIG !== 'undefined' && WEDDING_CONFIG.couple?.groom?.fullName) || "Venkatesh Reddy",
        bride: (typeof WEDDING_CONFIG !== 'undefined' && WEDDING_CONFIG.couple?.bride?.fullName) || "Ananya Reddy",
        date: (typeof WEDDING_CONFIG !== 'undefined' && WEDDING_CONFIG.events?.reception?.dateFormatted) || "Friday, 5 December 2026",
        time: (typeof WEDDING_CONFIG !== 'undefined' && WEDDING_CONFIG.events?.reception?.timeFormatted) || "at 7:00 PM onwards",
        venueName: (typeof WEDDING_CONFIG !== 'undefined' && WEDDING_CONFIG.events?.reception?.venueName) || "The Meridian Banquet",
        venueLocation: "Gachibowli, Hyderabad"
      }
    };

    function switchCardMode(mode) {
      currentMode = mode;
      
      document.getElementById('tabMarriage').classList.toggle('active', mode === 'marriage');
      document.getElementById('tabReception').classList.toggle('active', mode === 'reception');

      if (mode === 'marriage') {
        document.getElementById('panelHeading').innerHTML = '<i class="fas fa-pen-fancy"></i> Marriage Card Details';
        document.getElementById('previewHeading').innerHTML = '<i class="fas fa-eye"></i> Live Marriage Card Preview';
        document.getElementById('downloadBtn').innerHTML = '<i class="fas fa-download"></i> Download Marriage Card (WhatsApp)';
        canvas.width = 974;
        canvas.height = 1574;
      } else {
        document.getElementById('panelHeading').innerHTML = '<i class="fas fa-pen-fancy"></i> Reception Card Details';
        document.getElementById('previewHeading').innerHTML = '<i class="fas fa-eye"></i> Live Reception Card Preview';
        document.getElementById('downloadBtn').innerHTML = '<i class="fas fa-download"></i> Download Reception Card (WhatsApp)';
        canvas.width = 950;
        canvas.height = 1620;
      }

      renderFormFields();
      renderCard();
    }

    function renderFormFields() {
      const container = document.getElementById('dynamicFormFields');

      if (currentMode === 'marriage') {
        container.innerHTML = `
          <div class="form-group">
            <label>Top Shloka / Auspicious Line</label>
            <input type="text" id="mShloka" value="${state.marriage.shloka}" oninput="updateStateAndRender()">
          </div>
          <div class="form-row">
            <div class="form-group">
              <label>Groom's Name</label>
              <input type="text" id="mGroom" value="${state.marriage.groom}" oninput="updateStateAndRender()">
            </div>
            <div class="form-group">
              <label>Bride's Name</label>
              <input type="text" id="mBride" value="${state.marriage.bride}" oninput="updateStateAndRender()">
            </div>
          </div>
          <div class="form-group">
            <label>Parents' Info (Optional)</label>
            <input type="text" id="mParents" value="${state.marriage.parents}" oninput="updateStateAndRender()">
          </div>
          <div class="form-group">
            <label>Marriage Date & Time</label>
            <input type="text" id="mDate" value="${state.marriage.date}" oninput="updateStateAndRender()">
          </div>
          <div class="form-group">
            <label>Reception Date & Time</label>
            <input type="text" id="mReception" value="${state.marriage.receptionSummary}" oninput="updateStateAndRender()">
          </div>
          <div class="form-group">
            <label>Venue & City</label>
            <input type="text" id="mVenue" value="${state.marriage.venue}" oninput="updateStateAndRender()">
          </div>
          <div class="form-group">
            <label>Bottom Line (Family / RSVP)</label>
            <input type="text" id="mFamily" value="${state.marriage.family}" oninput="updateStateAndRender()">
          </div>
        `;
      } else {
        container.innerHTML = `
          <div class="form-row">
            <div class="form-group">
              <label>Groom's Name</label>
              <input type="text" id="rGroom" value="${state.reception.groom}" oninput="updateStateAndRender()">
            </div>
            <div class="form-group">
              <label>Bride's Name</label>
              <input type="text" id="rBride" value="${state.reception.bride}" oninput="updateStateAndRender()">
            </div>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label>Reception Date</label>
              <input type="text" id="rDate" value="${state.reception.date}" oninput="updateStateAndRender()">
            </div>
            <div class="form-group">
              <label>Time</label>
              <input type="text" id="rTime" value="${state.reception.time}" oninput="updateStateAndRender()">
            </div>
          </div>
          <div class="form-group">
            <label>Venue Name</label>
            <input type="text" id="rVenueName" value="${state.reception.venueName}" oninput="updateStateAndRender()">
          </div>
          <div class="form-group">
            <label>Venue Area / City</label>
            <input type="text" id="rVenueLocation" value="${state.reception.venueLocation}" oninput="updateStateAndRender()">
          </div>
        `;
      }
    }

    function updateStateAndRender() {
      if (currentMode === 'marriage') {
        state.marriage.shloka = document.getElementById('mShloka').value;
        state.marriage.groom = document.getElementById('mGroom').value;
        state.marriage.bride = document.getElementById('mBride').value;
        state.marriage.parents = document.getElementById('mParents').value;
        state.marriage.date = document.getElementById('mDate').value;
        state.marriage.receptionSummary = document.getElementById('mReception').value;
        state.marriage.venue = document.getElementById('mVenue').value;
        state.marriage.family = document.getElementById('mFamily').value;
      } else {
        state.reception.groom = document.getElementById('rGroom').value;
        state.reception.bride = document.getElementById('rBride').value;
        state.reception.date = document.getElementById('rDate').value;
        state.reception.time = document.getElementById('rTime').value;
        state.reception.venueName = document.getElementById('rVenueName').value;
        state.reception.venueLocation = document.getElementById('rVenueLocation').value;
      }
      renderCard();
    }

    function loadPreset(lang) {
      currentLang = lang;
      document.querySelectorAll('.preset-btn').forEach(b => b.classList.remove('active'));
      if (lang === 'en') document.getElementById('btnPresetEn').classList.add('active');
      if (lang === 'te') document.getElementById('btnPresetTe').classList.add('active');
      if (lang === 'hi') document.getElementById('btnPresetHi').classList.add('active');

      if (currentMode === 'marriage') {
        if (lang === 'te') {
          state.marriage.shloka = "|| శ్రీరస్తు - శుభమస్తు ||";
          state.marriage.date = "వివాహం: 04 డిసెంబర్ 2026 (ముహూర్తం: 9:30 AM)";
          state.marriage.receptionSummary = "రిసెప్షన్: 05 డిసెంబర్ 2026 (సాయంత్రం 7:00 PM)";
          state.marriage.family = "ఆహ్వానించువారు: బంధుమిత్రులు & కుటుంబ సభ్యులు";
        } else if (lang === 'hi') {
          state.marriage.shloka = "॥ ॐ श्री गणेशाय नमः ॥";
          state.marriage.date = "शुभ विवाह: 4 दिसंबर 2026 (प्रातः 9:30 बजे)";
          state.marriage.receptionSummary = "प्रीतिभोज: 5 दिसंबर 2026 (सायं 7:00 बजे)";
          state.marriage.family = "विनीत: समस्त परिवार";
        } else {
          state.marriage.shloka = "|| Shree Ganeshay Namah ||";
          state.marriage.date = "Dec 4, 2026 | Muhurtham: 9:30 AM";
          state.marriage.receptionSummary = "Reception: Dec 5, 2026 | 7:00 PM";
          state.marriage.family = "With Best Compliments from Family";
        }
      } else {
        if (lang === 'te') {
          state.reception.date = "శుక్రవారం, 05 డిసెంబర్ 2026";
          state.reception.time = "సాయంత్రం 7:00 గంటల నుండి";
        } else if (lang === 'hi') {
          state.reception.date = "शुक्रवार, 5 दिसंबर 2026";
          state.reception.time = "सायं 7:00 बजे से";
        } else {
          state.reception.date = "Friday, 5 December 2026";
          state.reception.time = "at 7:00 PM onwards";
        }
      }

      renderFormFields();
      renderCard();
    }

    function renderCard() {
      const yOffset = parseInt(document.getElementById('inputYOffset')?.value || 0, 10);
      const scale = parseFloat(document.getElementById('inputFontScale')?.value || 1.0);

      ctx.clearRect(0, 0, canvas.width, canvas.height);

      if (currentMode === 'marriage') {
        renderMarriageCard(yOffset, scale);
      } else {
        renderReceptionCard(yOffset, scale);
      }
    }

    /* Renders Marriage Card */
    function renderMarriageCard(yOffset, scale) {
      if (!imgMarriage.complete) return;
      ctx.drawImage(imgMarriage, 0, 0, canvas.width, canvas.height);

      const centerX = canvas.width / 2;
      const maroon = '#520B14';
      const gold = '#825400';
      const softDark = '#2B1A1D';

      // Shloka
      ctx.textAlign = 'center';
      ctx.fillStyle = gold;
      ctx.font = `bold ${Math.round(26 * scale)}px "Cinzel", "Noto Serif Telugu", "Noto Serif Devanagari", serif`;
      ctx.fillText(state.marriage.shloka, centerX, 915 + yOffset);

      // Names
      ctx.fillStyle = maroon;
      ctx.font = `bold ${Math.round(40 * scale)}px "Playfair Display", "Noto Serif Telugu", "Noto Serif Devanagari", serif`;
      ctx.fillText(state.marriage.groom, centerX, 975 + yOffset);

      ctx.fillStyle = gold;
      ctx.font = `italic bold ${Math.round(28 * scale)}px "Playfair Display", serif`;
      ctx.fillText("&", centerX, 1015 + yOffset);

      ctx.fillStyle = maroon;
      ctx.font = `bold ${Math.round(40 * scale)}px "Playfair Display", "Noto Serif Telugu", "Noto Serif Devanagari", serif`;
      ctx.fillText(state.marriage.bride, centerX, 1060 + yOffset);

      // Parents
      let currentY = 1098 + yOffset;
      if (state.marriage.parents) {
        ctx.fillStyle = softDark;
        ctx.font = `500 ${Math.round(20 * scale)}px "Montserrat", "Noto Serif Telugu", sans-serif`;
        ctx.fillText(state.marriage.parents, centerX, currentY);
        currentY += 28;
      }

      // Divider
      ctx.strokeStyle = '#D4AF37';
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.moveTo(centerX - 90, currentY);
      ctx.lineTo(centerX + 90, currentY);
      ctx.stroke();
      currentY += 32;

      // Dates
      ctx.fillStyle = maroon;
      ctx.font = `bold ${Math.round(22 * scale)}px "Montserrat", "Noto Serif Telugu", sans-serif`;
      ctx.fillText(state.marriage.date, centerX, currentY);
      currentY += 32;

      ctx.fillStyle = softDark;
      ctx.font = `600 ${Math.round(20 * scale)}px "Montserrat", "Noto Serif Telugu", sans-serif`;
      ctx.fillText(state.marriage.receptionSummary, centerX, currentY);
      currentY += 32;

      // Venue
      ctx.fillStyle = softDark;
      ctx.font = `500 ${Math.round(19 * scale)}px "Montserrat", "Noto Serif Telugu", sans-serif`;
      wrapText(ctx, state.marriage.venue, centerX, currentY, 440, Math.round(24 * scale));

      // Family
      ctx.fillStyle = gold;
      ctx.font = `italic bold ${Math.round(20 * scale)}px "Playfair Display", "Noto Serif Telugu", serif`;
      ctx.fillText(state.marriage.family, centerX, 1345 + yOffset);
    }

    /* Renders Reception Card */
    function renderReceptionCard(yOffset, scale) {
      if (!imgReception.complete) return;
      ctx.drawImage(imgReception, 0, 0, canvas.width, canvas.height);

      const centerX = canvas.width / 2; // 475
      const emerald = '#113E27';
      const gold = '#A67B28';
      const goldLight = '#F7E7B8';
      const white = '#FFFFFF';

      ctx.textAlign = 'center';

      // 1. Groom & Bride Names in Luxury Calligraphy
      ctx.fillStyle = emerald;
      ctx.font = `italic 700 ${Math.round(52 * scale)}px "Great Vibes", "Playfair Display", "Noto Serif Telugu", cursive`;
      ctx.fillText(state.reception.groom, centerX, 690 + yOffset);

      ctx.fillStyle = gold;
      ctx.font = `italic 600 ${Math.round(36 * scale)}px "Great Vibes", "Playfair Display", cursive`;
      ctx.fillText("— & —", centerX, 765 + yOffset);

      ctx.fillStyle = emerald;
      ctx.font = `italic 700 ${Math.round(52 * scale)}px "Great Vibes", "Playfair Display", "Noto Serif Telugu", cursive`;
      ctx.fillText(state.reception.bride, centerX, 845 + yOffset);

      // 2. Date & Time
      ctx.textAlign = 'left';
      ctx.fillStyle = emerald;
      ctx.font = `bold ${Math.round(23 * scale)}px "Montserrat", "Noto Serif Telugu", sans-serif`;
      
      // Date on left side (approx X=260)
      ctx.fillText(state.reception.date, 260, 1070 + yOffset);

      // Time on right side (approx X=610)
      ctx.fillText(state.reception.time, 610, 1070 + yOffset);

      // 3. Venue Box (Green Badge)
      ctx.textAlign = 'center';
      ctx.fillStyle = goldLight;
      ctx.font = `bold ${Math.round(28 * scale)}px "Playfair Display", "Montserrat", sans-serif`;
      ctx.fillText(state.reception.venueName, centerX, 1290 + yOffset);

      ctx.fillStyle = white;
      ctx.font = `500 ${Math.round(21 * scale)}px "Montserrat", sans-serif`;
      ctx.fillText(state.reception.venueLocation, centerX, 1340 + yOffset);
    }

    function wrapText(context, text, x, y, maxWidth, lineHeight) {
      const words = text.split(' ');
      let line = '';

      for (let n = 0; n < words.length; n++) {
        const testLine = line + words[n] + ' ';
        const metrics = context.measureText(testLine);
        const testWidth = metrics.width;
        if (testWidth > maxWidth && n > 0) {
          context.fillText(line, x, y);
          line = words[n] + ' ';
          y += lineHeight;
        } else {
          line = testLine;
        }
      }
      context.fillText(line, x, y);
    }

    function downloadCard() {
      const link = document.createElement('a');
      const filename = currentMode === 'marriage' ? 'wedding_marriage_card_dec4.jpg' : 'wedding_reception_card_dec5.jpg';
      link.download = filename;
      link.href = canvas.toDataURL('image/jpeg', 0.95);
      link.click();
    }

    // Init on load
    imgMarriage.onload = () => { if (currentMode === 'marriage') renderCard(); };
    imgReception.onload = () => { if (currentMode === 'reception') renderCard(); };

    window.onload = () => {
      switchCardMode('reception');
    };
  </script>
</body>
